{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>ESTHER MOFREY FX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="{% static 'img/favicon.ico' %}">

    <!-- Google Web Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/animate/animate.min.css' %}" rel="stylesheet">
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    
    <!-- Inline Styles for Login Form -->
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f8f9fa;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
            
        }
        .login-form {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 50px;
            width: 420px;
            text-align: center;
        }
        .login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #06BBCC;
            color: #ffffff;
            cursor: pointer;
        }
        .login-form button:hover {
            background-color: #06BBCC;
        }
              /* Remember me container */
              .remember-me-container {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                margin-bottom: 15px;
                text-align: left;
            }
    
            .remember-me-container input {
                margin-right: 10px;
            }
    
            .forgot-password-link {
                margin-top: 10px;
            }
    </style>
</head>

<body>

    <!-- Navbar Start -->
 
   <!-- Navbar Start -->
<nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0">
    <a href="index.html" class="navbar-brand d-flex align-items-center px-4 px-lg-5">
        <h2 class="m-0 text-primary"><i class="fa fa-book me-3"></i>Esther Mofrey FX</h2>
    </a>
    <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
        <div class="navbar-nav ms-auto p-4 p-lg-0">
            <a href=" " class="nav-item nav-link active">Home</a>
            <a href="/about" class="nav-item nav-link">About</a>
            <a href="/allcourses" class="nav-item nav-link">Courses</a>
            <a href="/gallery" class="nav-item nav-link">Gallery</a>
            <a href="/contact" class="nav-item nav-link">Contact</a>
            <a href="/watchlist" class="nav-item nav-link">Bought courses</a>
            <a href=" /profile" class="nav-item nav-link">Profile</a>
        </div>
        
        <!-- Login and Register Icons with Text -->
        <div class="d-flex align-items-center">
            <a href="/login" class="nav-link me-3">
                <i class="fa fa-sign-in-alt"></i> Login
            </a>
            <a href="/register" class="nav-link">
                <i class="fa fa-user-plus"></i> Register
            </a>
        </div>
    </div>
</nav>
    <!-- Navbar End -->

    <!-- Login Form Section -->
    <div class="login-container">
        <div class="login-form">
            <h2>Login</h2>
            <form action="/auth_login" method="POST">
                {% csrf_token %}
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                
                <button type="submit">Login</button>
                {{message}}
                <a href="/forgot_password">Forgot password?</a>
            </form>
        </div>
    </div>
    <!-- End Login Form Section -->


    

    
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'lib/wow/wow.min.js' %}"></script>
    <script src="{% static 'lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
    <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>

    <!-- Template Javascript -->
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
