{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        /* Custom styles for the error page */
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .error-container {
            text-align: center;
            padding: 30px;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .error-container h2 {
            color: #dc3545;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .error-container p {
            color: #333;
            font-size: 19px;
            margin-bottom: 20px;
        }

        .error-input {
            width: 300px;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .error-emoji {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="error-container">
        <div class="error-emoji">&#128577;</div>
        <h2>Error</h2>
        <p>Please finish watching and answering the previous module questions and pass the test to download your certificate.</p>
    </div>

</body>

</html>
